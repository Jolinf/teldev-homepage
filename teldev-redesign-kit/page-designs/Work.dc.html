<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="teldev-site.css">
  <link rel="stylesheet" href="ds/teldev/components/bundle.css">
  <script src="ds/teldev/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1c6cfe; } a:hover { color: #0b53e5; }
  </style>
</helmet>
<div class="ds-root" style="width: 1440px; height: 3900px; display: flex; flex-direction: column; background: #f9fafb;">
  <x-import component-from-global-scope="TELDEV.Header"></x-import>

  <section class="ds-section ds-hero-section" style="background: #ffffff;">
    <div class="ds-container ds-hero-top">
      <div class="ds-anim-in" style="display: flex; flex-direction: column; gap: 20px; align-items: flex-start;">
        <x-import component-from-global-scope="TELDEV.Breadcrumbs" items="{{crumbs}}"></x-import>
        <h1 class="h1">Work we've done, <span class="ds-accent-text">told plainly.</span></h1>
        <p class="lead" style="color: #555d6d; max-width: 540px;">The problem, what we did, and what changed — for businesses and institutions across Nigeria.</p>
      </div>
      <x-import component-from-global-scope="TELDEV.LayeredVisual" photo="{{photo}}" cards="{{cards}}"></x-import>
    </div>
  </section>

  <section class="ds-section" style="background: #f9fafb;">
    <div class="ds-container" style="display: flex; flex-direction: column; gap: 40px;">
      <div class="ds-sectionhead">
        <span class="overline ds-overline">Case studies</span>
        <h2 class="h2">Selected projects</h2>
      </div>
      <x-import component-from-global-scope="TELDEV.CaseStudy" title="[Project title — e.g. an office network and Microsoft 365 rollout]" summary="[One sentence: the problem, what we did, and what changed]" note="Engineer and client reviewing the finished rollout on site." metric-icon="check-circle" metric-label="[Headline result]" metric-value="[—]"></x-import>
      <x-import component-from-global-scope="TELDEV.CaseStudy" title="[Project title — e.g. a website that brings in enquiries]" summary="[One sentence: the problem, what we did, and what changed]" note="Client using the new site on a phone, natural light." metric-icon="building" metric-label="[Headline result]" metric-value="[—]"></x-import>
    </div>
  </section>

  <section class="ds-section" style="background: #ffffff;">
    <div class="ds-container ds-two-col">
      <x-import component-from-global-scope="TELDEV.Testimonial" quote="[A two-sentence quote from a real client, used with permission]" name="[Client name]" role="[Role, organisation]"></x-import>
      <x-import component-from-global-scope="TELDEV.Testimonial" quote="[A second client quote about a finished project]" name="[Client name]" role="[Role, organisation]"></x-import>
    </div>
  </section>

  <section class="ds-section" style="background: #f9fafb;">
    <div class="ds-container">
      <x-import component-from-global-scope="TELDEV.CTABanner" heading="Have a project like these?" body="Tell us what you're trying to do — we'll tell you plainly whether we can help." cta="Request a quote"></x-import>
    </div>
  </section>

  <x-import component-from-global-scope="TELDEV.Footer"></x-import>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":3900}}'>
class Component extends DCLogic {
  renderVals() {
    const h = window.React.createElement, T = window.TELDEV || {};
    return {
      crumbs: [{ label: "Home", href: "#" }, { label: "Work" }],
      photo: { label: "Project photograph", note: "Engineer and client reviewing a finished rollout on site, natural light." },
      cards: T.TicketCard ? [
        { pos: "tl", width: "270px", content: h(T.TicketCard, { code: "Project handover", status: "Complete", title: "Office network and Microsoft 365 rollout", sub: "Handed over with documentation" }) },
        { pos: "bl", content: h(T.FlowCard, { label: "Every project", steps: ["Audit", "Build", "Handover"] }) }
      ] : []
    };
  }
}
</script>
</body>
</html>
