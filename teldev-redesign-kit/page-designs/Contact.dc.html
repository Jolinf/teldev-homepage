<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
  <link rel="stylesheet" href="teldev-site.css">
  <link rel="stylesheet" href="ds/teldev/components/bundle.css">
  <script src="ds/teldev/components/bundle.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #1c6cfe; } a:hover { color: #0b53e5; }
  </style>
</helmet>
<div class="ds-root" style="width: 1440px; height: 1900px; display: flex; flex-direction: column; background: #f9fafb;">
  <x-import component-from-global-scope="TELDEV.Header"></x-import>

  <section class="ds-section" style="background: #f9fafb;">
    <div class="ds-container ds-contact-grid">
      <div style="display: flex; flex-direction: column; gap: 20px;">
        <div class="ds-anim-in" style="display: flex; flex-direction: column; gap: 20px; align-items: flex-start;">
          <x-import component-from-global-scope="TELDEV.Breadcrumbs" items="{{crumbs}}"></x-import>
          <h1 class="h1">Let's talk about <span class="ds-accent-text">what you need.</span></h1>
          <p class="lead" style="color: #555d6d;">Tell us what you're trying to do, and we'll tell you plainly whether we can help.</p>
        </div>
        <x-import component-from-global-scope="TELDEV.LayeredVisual" photo="{{photo}}" cards="{{cards}}"></x-import>
      </div>
      <div class="ds-contact-form">
        <x-import component-from-global-scope="TELDEV.ContactForm"></x-import>
      </div>
    </div>
  </section>

  <x-import component-from-global-scope="TELDEV.Footer"></x-import>
</div>
</x-dc>
<script data-dc-script data-props='{"$preview":{"width":1440,"height":1900}}'>
class Component extends DCLogic {
  renderVals() {
    const h = window.React.createElement, T = window.TELDEV || {};
    return {
      crumbs: [{ label: "Home", href: "#" }, { label: "Contact" }],
      photo: { label: "Contact photograph", note: "The TELDEV team at the Lagos office, candid, natural light." },
      cards: T.MetricCard ? [
        { pos: "tl", width: "220px", content: h(T.MetricCard, { icon: "mail", label: "Typical reply", value: "1 working day" }) },
        { pos: "br", width: "260px", content: h(T.FlowCard, { label: "What happens next", steps: ["Enquiry", "Call", "Quote"] }) },
        { pos: "bl", content: h(T.InfoCard, { icon: "map-pin", title: "Lagos, Nigeria", sub: "contact@teldev.org" }) }
      ] : []
    };
  }
}
</script>
</body>
</html>
